<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luo's MicroBlog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --grid-color: rgba(0, 0, 0, 0.05);
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-secondary: #6c757d;
            --accent-primary: #007bff;
            --accent-secondary: #fd7e14;
            --border-color: #dee2e6;
            --font-mono: 'Fira Code', 'Consolas', monospace;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,.05);
            --shadow-hover: 0 10px 15px rgba(0,0,0,.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        

                html { scroll-behavior: smooth; }

        

                body {

                    font-family: var(--font-sans);

                    background-color: var(--bg-color);

                    color: var(--text-main);

                    line-height: 1.7;

                    background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),

                                      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);

                    background-size: 20px 20px;

                }

        

                .top-bar {

                    position: fixed;

                    top: 0; left: 0; width: 100%; height: 4px;

                    background: linear-gradient(90deg, var(--accent-primary), #6610f2);

                    z-index: 1000;

                }

        

                .page-wrapper {

                    display: flex;

                    max-width: 1200px;

                    margin: 0 auto;

                    padding: 4rem 2rem;

                    gap: 2rem;

                }

        

                .timeline-sidebar {

                    flex: 0 0 220px;

                    position: sticky;

                    top: 4rem;

                    align-self: flex-start;

                    max-height: calc(100vh - 6rem);

                    overflow-y: auto;

                    padding-right: 1rem;

                }

        

                .timeline-nav h3 {

                    font-size: 0.875rem;

                    font-family: var(--font-mono);

                    color: var(--text-secondary);

                    text-transform: uppercase;

                    letter-spacing: 1px;

                    padding-bottom: 0.5rem;

                    border-bottom: 1px solid var(--border-color);

                    margin-bottom: 1rem;

                }

        

                .timeline-year { margin-bottom: 1.5rem; }

                .timeline-year > a {

                    font-size: 1.3rem;

                    font-weight: 800;

                    color: var(--text-main);

                    text-decoration: none;

                    transition: color 0.2s;

                }

                .timeline-year > a:hover { color: var(--accent-primary); }

        

                .timeline-months {

                    list-style: none;

                    margin-top: 0.75rem;

                    padding-left: 0.75rem;

                    border-left: 2px solid var(--border-color);

                }

                .timeline-months li a {

                    display: flex;

                    justify-content: space-between;

                    align-items: center;

                    padding: 0.5rem 0.8rem;

                    font-size: 0.95rem;

                    color: var(--text-secondary);

                    text-decoration: none;

                    border-radius: 4px;

                    transition: all 0.2s ease;

                }

                .timeline-months li a:hover {

                    background-color: rgba(0, 123, 255, 0.05);

                    color: var(--accent-primary);

                    transform: translateX(4px);

                }

                .timeline-month-count {

                    font-family: var(--font-mono);

                    font-size: 0.8rem;

                    background-color: #e9ecef;

                    color: var(--text-secondary);

                    padding: 0.1rem 0.4rem;

                    border-radius: 4px;

                    transition: all 0.2s ease;

                }

                .timeline-months a:hover .timeline-month-count {

                    background-color: var(--accent-primary);

                    color: white;

                }

        

                .main-content { flex: 1 1 auto; min-width: 0; }

                .header { margin-bottom: 3rem; text-align: center; }

                .header h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.04em; }

                .header h1 span.dot { color: var(--accent-primary); }

                .header-subtitle { font-size: 1.15rem; color: var(--text-secondary); margin-top: 0.5rem; }

        

                .posts-container { display: flex; flex-direction: column; gap: 2.5rem; }

        

                .post {

                    display: flex;

                    flex-direction: column;

                    background: var(--card-bg);

                    border: 1px solid var(--border-color);

                    border-radius: 8px;

                    box-shadow: var(--shadow-sm);

                    transition: all 0.3s ease;

                }

                .post:hover {

                    transform: translateY(-3px);

                    box-shadow: var(--shadow-hover);

                    border-color: rgba(0, 123, 255, 0.5);

                }

        

                .post-content {

                    padding: 2rem;

                    font-size: 1.05rem;

                    line-height: 1.8;

                    flex-grow: 1;

                }

                .post-content > *:first-child { margin-top: 0; }

                .post-content > *:last-child { margin-bottom: 0; }

                

                .post-footer {

                    padding: 0.75rem 2rem;

                    border-top: 1px solid var(--border-color);

                    text-align: right;

                    background-color: #fcfdff;

                    border-radius: 0 0 8px 8px;

                }

                .post-date {

                    font-family: var(--font-mono);

                    font-size: 0.85rem;

                    color: var(--text-secondary);

                }

        

                .post-content p { margin-bottom: 1em; }

                .post-content code {

                    font-family: var(--font-mono);

                    background-color: rgba(0, 123, 255, 0.08);

                    color: var(--accent-primary);

                    padding: 0.15em 0.4em;

                    border-radius: 4px;

                    font-size: 0.9em;

                }

                .post-content pre {

                    background-color: #f1f3f5;

                    border: 1px solid var(--border-color);

                    border-radius: 6px; padding: 1rem;

                    overflow-x: auto; margin: 1.5rem 0; font-size: 0.9rem;

                }

                .post-content blockquote {

                    border-left: 4px solid var(--accent-secondary);

                    background: #fff9f2; margin: 1.5rem 0;

                    padding: 1rem 1.5rem; color: #58412c;

                }

                .post-content a {

                    color: var(--accent-primary); font-weight: 600;

                    text-decoration: none; border-bottom: 2px solid transparent;

                    transition: border-color 0.2s;

                }

                .post-content a:hover { border-bottom-color: var(--accent-primary); }

                .post-content img {

                    max-width: 100%; height: auto;

                    border-radius: 6px; margin: 1.2rem 0;

                }

        

                .empty {

                    text-align: center; padding: 4rem 2rem;

                    background: var(--card-bg); border: 2px dashed var(--border-color);

                    border-radius: 12px; color: var(--text-secondary);

                    font-family: var(--font-mono);

                }

        

                @media (max-width: 992px) {

                    .page-wrapper { flex-direction: column; }

                    .timeline-sidebar {

                        position: static; flex: 1; max-height: none;

                        order: -1; margin-bottom: 2rem; padding-right: 0;

                    }

                }

                @media (max-width: 768px) {

                    .page-wrapper { padding: 3rem 1rem; }

                    .header h1 { font-size: 2.5rem; }

                    .post-content { padding: 1.5rem; }

                    .post-footer { padding: 0.75rem 1.5rem; }

                }
    </style>
</head>
<body>
    <div class="top-bar"></div>

    <div class="page-wrapper">
        <aside class="timeline-sidebar">
            <nav class="timeline-nav">
                <h3>Timeline</h3>
                
                <div class="timeline-year">
                    <a href="#post-">2025</a>
                    <ul class="timeline-months">
                        
                        <li>
                            <a href="#post-20251127123751">
                                <span>November</span>
                                <span class="timeline-month-count">1</span>
                            </a>
                        </li>
                        
                        <li>
                            <a href="#post-20250720223200">
                                <span>July</span>
                                <span class="timeline-month-count">1</span>
                            </a>
                        </li>
                        
                    </ul>
                </div>
                
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Luo's MicroBlog<span class="dot">.</span></h1>
                <p class="header-subtitle">Recording My Life</p>
            </header>
            
            <div class="posts-container">
                
                    
                        <article class="post" id="post-20251127123751">
                            <div class="post-content"><p>hello world!!! (这是一个没有日期的帖子, 会自动使用当前日期)</p></div>
                            
                                <div class="post-footer">
                                    <span class="post-date">2025-11-27 12:37</span>
                                </div>
                            
                        </article>
                    
                        <article class="post" id="post-20250720223200">
                            <div class="post-content"><p>新购买了一个macbook air 16+256😊</p></div>
                            
                                <div class="post-footer">
                                    <span class="post-date">2025-07-20 22:32</span>
                                </div>
                            
                        </article>
                    
                
            </div>
        </main>
    </div>
</body>
</html>
