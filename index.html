<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroLog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #424242;
            line-height: 1.6;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* 动态几何背景 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .geometric-shape {
            position: absolute;
            opacity: 0.4;
            animation: float 20s infinite linear;
        }

        .shape-1 {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #7986cb, #5c6bc0);
            border-radius: 50%;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #ff8a65, #ff7043);
            transform: rotate(45deg);
            top: 60%;
            right: 15%;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #81c784, #66bb6a);
            border-radius: 30%;
            top: 80%;
            left: 20%;
            animation-delay: -10s;
        }

        .shape-4 {
            width: 70px;
            height: 70px;
            background: linear-gradient(45deg, #ffb74d, #ffa726);
            border-radius: 50% 0 50% 0;
            top: 30%;
            right: 30%;
            animation-delay: -15s;
        }

        .shape-5 {
            width: 50px;
            height: 80px;
            background: linear-gradient(45deg, #64b5f6, #42a5f5);
            border-radius: 50px;
            top: 10%;
            left: 60%;
            animation-delay: -7s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) rotate(90deg);
            }
            50% {
                transform: translateY(-40px) rotate(180deg);
            }
            75% {
                transform: translateY(-20px) rotate(270deg);
            }
            100% {
                transform: translateY(0px) rotate(360deg);
            }
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            color: #1976d2;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .header::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #1976d2, #42a5f5);
            margin: 1rem auto 0;
            border-radius: 2px;
        }

        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .post {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .post::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .post:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .post:hover::before {
            left: 100%;
        }

        .post-date {
            font-size: 0.875rem;
            color: #757575;
            margin-bottom: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .post-date::before {
            content: '•';
            color: #1976d2;
            font-size: 1.2rem;
        }

        .post-content {
            font-size: 1.125rem;
            line-height: 1.75;
            color: #212121;
        }

        .post-content p {
            margin: 0.75em 0;
        }

        .post-content ul, .post-content ol {
            margin: 0.75em 0 0.75em 1.5em;
        }

        .post-content blockquote {
            border-left: 4px solid #1976d2;
            padding-left: 1.5rem;
            margin: 1rem 0;
            color: #424242;
            font-style: italic;
            background: rgba(25, 118, 210, 0.05);
            padding: 1rem 1.5rem;
            border-radius: 8px;
        }

        .empty {
            text-align: center;
            color: #757575;
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
            font-size: 1.125rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .post {
                padding: 1.5rem;
            }
        }

        /* 加载动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .post:nth-child(1) { animation-delay: 0.1s; }
        .post:nth-child(2) { animation-delay: 0.2s; }
        .post:nth-child(3) { animation-delay: 0.3s; }
        .post:nth-child(4) { animation-delay: 0.4s; }
        .post:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <!-- 动态几何背景 -->
    <div class="bg-animation">
        <div class="geometric-shape shape-1"></div>
        <div class="geometric-shape shape-2"></div>
        <div class="geometric-shape shape-3"></div>
        <div class="geometric-shape shape-4"></div>
        <div class="geometric-shape shape-5"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>MicroLog</h1>
        </div>
        
        <div class="posts-container">
            
                
                    <div class="post">
                        <div class="post-date">2025-07-19 12:12</div>
                        <div class="post-content"><p>生活就像编程，有时候需要debug 🐛</p></div>
                    </div>
                
                    <div class="post">
                        <div class="post-date">2025-07-15 22:55</div>
                        <div class="post-content"><p>hello world!!!</p></div>
                    </div>
                
            
        </div>
    </div>
</body>
</html>
