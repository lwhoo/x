                            <div class="tweet-content"><p>最近发觉自己对于是食物失去了惊艳感，感觉每一样吃起来都无功无过。说来可能是因为大致上能吃的食物都尝试过了，食物的舒适区也就是鸡鸭羊鱼猪和各种蔬菜水果。烹饪方法也就是那些，调料也换汤不换药。那么惊艳感来说，没有任何感觉似乎也说得通了，我并不会逃离自己的食物舒适区，在有限的搭配都尝试过后也就不会有任何感觉了。当然搭配之间也是有着某种相似性，就像大脑会将清绿深绿都判别绿色一样，鸡肉的口感都会准确的被判断正确。</p></div>
