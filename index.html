<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luo's MicroBlog</title>
    
    <script>
      if (!sessionStorage.getItem('refreshed')) {
        sessionStorage.setItem('refreshed', '1');
        const url = new URL(location.href);
        url.searchParams.set('_t', Date.now());
        location.replace(url);
      } else {
        sessionStorage.removeItem('refreshed');
      }
    </script>

    <style>
        :root {
            --primary: #2563eb; /* Modern blue */
            --primary-light: #3b82f6; /* Lighter blue */
            --primary-lighter: #dbeafe; /* Very light blue */
            --bg: #f8fafc; /* Clean, bright white-ish */
            --bg-secondary: #f1f5f9; /* Slight gray */
            --text: #1e293b; /* Dark text */
            --text-muted: #64748b; /* Muted gray */
            --accent: #06b6d4; /* Cyan accent */
            --border: #e2e8f0; /* Light border */
            --radius: 8px; /* Smooth, modern corners */
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            --font-mono: 'Fira Code', 'IBM Plex Mono', 'Courier New', monospace;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            line-height: 1.65;
            font-size: 17px;
            min-height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(0deg, rgba(51, 65, 85, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Minimal background canvas - subtle effect */
        #bg-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.08; }

        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
            opacity: 1;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
        }

        /* 手机菜单按钮 */
        .mobile-menu-btn {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            width: 48px; height: 48px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.1);
            transition: all 0.3s ease;
        }
        .mobile-menu-btn:hover {
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
            border-color: var(--primary);
            background: rgba(255, 255, 255, 1);
        }
        .mobile-menu-btn span,
        .mobile-menu-btn span::before,
        .mobile-menu-btn span::after {
            width: 22px; height: 2px; background: var(--text); border-radius: 1px; transition: 0.3s;
        }
        .mobile-menu-btn span::before,
        .mobile-menu-btn span::after { content: ''; position: absolute; }
        .mobile-menu-btn span::before { top: -7px; }
        .mobile-menu-btn span::after { bottom: -7px; }
        .mobile-menu-btn.active span { background: transparent; }
        .mobile-menu-btn.active span::before { transform: translateY(7px) rotate(45deg); }
        .mobile-menu-btn.active span::after { transform: translateY(-7px) rotate(-45deg); }

        /* 抽屉 + 遮罩 */
        .drawer-overlay {
            position: fixed; inset: 0;
            background: rgba(30, 41, 59, 0.15); /* Subtle dark overlay */
            backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden;
            transition: all 0.4s ease;
            z-index: 998;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }

        .timeline-drawer {
            position: fixed;
            left: -300px; top: 0; bottom: 0;
            width: 290px;
            background: rgba(255, 255, 255, 0.95);
            border-right: none;
            padding: 6.5rem 1.8rem 2rem;
            overflow-y: auto;
            transition: left 0.45s cubic-bezier(0.16,1,0.3,1);
            z-index: 999;
            box-shadow: 4px 0 16px rgba(30, 41, 59, 0.1);
        }
        .timeline-drawer.active { left: 0; }

        /* 布局 */
        .page-wrapper {
            max-width: 1340px;
            margin: 0 auto;
            padding: 5.5rem 2.5rem 8rem;
            display: flex;
            gap: 6rem;
            position: relative;
            z-index: 2;
        }

        /* 侧边栏 */
        .timeline-sidebar {
            flex: 0 0 240px;
            position: sticky;
            top: 2rem;
            align-self: flex-start;
        }
        .timeline-nav {
            background: transparent;
            border: none;
            border-radius: var(--radius);
            padding: 1.8rem 0;
            box-shadow: none;
            backdrop-filter: none;
            transition: all 0.3s ease;
        }
        .timeline-nav:hover {
            box-shadow: none;
            border-color: transparent;
        }
        .timeline-nav h3 {
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            color: var(--text-muted);
            margin-bottom: 1.6rem;
        }
        .timeline-year > a {
            display: block;
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            padding: 8px 0;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .timeline-year > a:hover { 
            color: var(--primary);
            transform: translateX(8px);
        }
        .timeline-months a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            margin: 5px 0;
            border-radius: var(--radius);
            color: var(--text-muted);
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .timeline-months a:hover {
            background: var(--primary-lighter);
            color: var(--primary);
            transform: translateX(6px);
            border-color: var(--primary-light);
        }
        .timeline-month-count {
            font-size: 11.5px;
            font-weight: 600;
            background: var(--primary-lighter);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 4px 9px;
            border-radius: 10px;
            min-width: 32px;
            text-align: center;
        }

        /* 主内容区 */
        .main-content { flex: 1; min-width: 0; }

        .header {
            text-align: center;
            margin-bottom: 4rem;
        }
        .header h1 {
            font-size: clamp(48px, 8vw, 72px);
            font-weight: 900;
            letter-spacing: -0.04em;
            margin: 0;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header h1 span.dot { 
            color: var(--accent); 
            -webkit-text-fill-color: var(--accent);
        }
        .header-subtitle {
            font-size: 19px;
            color: var(--text-muted);
            margin-top: 1rem;
            font-weight: 500;
        }

        .posts-container { 
            display: flex; 
            flex-direction: column; 
            gap: 0; /* No gap - continuous flow */
            position: relative;
        }

        .post {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
            transition: all 0.3s ease;
            backdrop-filter: none;
            position: relative;
            padding: 2rem 0;
        }
        .post:first-child {
            border-top: none;
            padding-top: 0;
        }
        .post::before {
            content: '';
            position: absolute;
            left: -60px;
            top: 50%;
            width: 40px;
            height: 1px;
            background: var(--border);
            transform: translateY(-50%);
        }
        .post::after {
            content: '';
            position: absolute;
            left: -40px;
            top: 50%;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border: 2px solid var(--bg-secondary);
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 0 3px var(--bg-secondary);
        }
        .post:hover {
            transform: none;
            box-shadow: none;
        }
        .post:hover::after {
            background: var(--accent);
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.3), 0 0 0 3px var(--bg-secondary);
        }

        .post-content {
            padding: 3.2rem 3rem 2.8rem;
            font-size: 18px;
            position: relative;
            z-index: 2;
            line-height: 1.75;
        }
        .post-footer {
            padding: 1rem 3rem 0 3rem;
            background: transparent;
            border-top: none;
            text-align: right;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .empty {
            text-align: center;
            padding: 8rem 2rem;
            background: rgba(248, 250, 252, 0.5);
            border: 1.5px dashed var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            font-size: 19px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.05);
            font-family: var(--font-mono);
        }

        /* 响应式 */
        @media (max-width: 992px) {
            .timeline-sidebar { display: none; }
            .page-wrapper { padding: 5.5rem 1.6rem 7rem; flex-direction: column; }
            .mobile-menu-btn { display: grid; }
        }
        @media (min-width: 993px) {
            .mobile-menu-btn, .drawer-overlay, .timeline-drawer { display: none !important; }
        }
        @media (max-width: 480px) {
            .post-content { padding: 2.6rem 2.2rem; font-size: 17.5px; }
            .header h1 { font-size: 48px; }
        }
    </style>
</head>
<body>

    <!-- 抽屉脚本 -->
    <script>
        document.getElementById('menuBtn').onclick = () => {
            const active = document.getElementById('drawer').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active', active);
            document.getElementById('menuBtn').classList.toggle('active', active);
        };
        document.getElementById('overlay').onclick = () => {
            document.getElementById('drawer').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('menuBtn').classList.remove('active');
        };
    </script>

    <!-- Matrix rain background script for geek effect -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        // Minimal geometric shapes for modern geek aesthetic
        const shapes = ['·', '─', '│', '┌', '┐', '└', '┘'];
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array.from({ length: columns }, () => Math.random() * -columns);

        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });

        function draw() {
            ctx.fillStyle = "rgba(248, 250, 252, 0.02)"; /* Match light background fade */
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(37, 99, 235, 0.15)"; // Subtle blue
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = shapes[Math.floor(Math.random() * shapes.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.985) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50);
    </script>
